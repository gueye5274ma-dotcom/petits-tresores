backend:
  name: git-gateway
  branch: main

# Là où les photos que vous ajoutez depuis l'administration sont enregistrées
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Aperçu en direct désactivé (le site utilise un style personnalisé non reconnu par l'éditeur)
show_preview_links: false

collections:
  - name: "produits"
    label: "Catalogue"
    label_singular: "Article"
    description: "Les articles affichés sur la boutique. Chaque fiche = un article du catalogue."
    files:
      - file: "content/products.json"
        label: "Articles de la boutique"
        name: "catalogue"
        fields:
          - label: "Articles"
            name: "products"
            widget: "list"
            label_singular: "Article"
            summary: "{{fields.name}} — {{fields.price}} F CFA"
            fields:
              - label: "Identifiant interne"
                name: "id"
                widget: "string"
                hint: "Ne changez jamais l'identifiant d'un article déjà publié (ex: n1, n2...). Pour un nouvel article, utilisez un identifiant qui n'existe pas encore, par exemple n21."
              - label: "Catégorie"
                name: "cat"
                widget: "select"
                options:
                  - { label: "Femmes", value: "femmes" }
                  - { label: "Enfants", value: "enfants" }
              - label: "Nom de l'article"
                name: "name"
                widget: "string"
              - label: "Description"
                name: "desc"
                widget: "text"
              - label: "Prix (en F CFA)"
                name: "price"
                widget: "number"
                value_type: "int"
                min: 0
              - label: "Photo"
                name: "photo"
                widget: "image"
                hint: "Choisissez une photo nette et bien cadrée. Elle sera affichée en carré."
              - label: "Numéro de référence / ordre d'affichage"
                name: "order"
                widget: "number"
                value_type: "int"
                hint: "Ce numéro détermine à la fois l'ordre d'affichage sur le site et le numéro de référence (PT-xx) montré aux clientes lors de la commande. Donnez un numéro différent à chaque article."
